name: Import and Occurrence Regression

on:
  push:
    branches:
      - feature/import-preview-full-edit-2026-11-23
  pull_request:
    branches:
      - feature/import-preview-full-edit-2026-11-23
  workflow_dispatch:

permissions:
  contents: read

jobs:
  import-regression:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: ci
          POSTGRES_PASSWORD: ci
          POSTGRES_DB: shikhasetu_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U ci -d shikhasetu_ci"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      # npm ci can omit platform-specific optional native packages when a
      # Windows-generated lockfile is consumed on Linux. Install the exact
      # Ubuntu x64 binaries explicitly in CI without changing package manifests.
      - name: Install Linux native CSS bindings
        run: >
          npm install --workspace=web --no-save --include=optional
          @tailwindcss/oxide-linux-x64-gnu@4.3.3
          lightningcss-linux-x64-gnu@1.32.0

      - name: Validate Prisma schema
        run: npx prisma validate --config prisma7.config.ts
        env:
          DATABASE_URL: postgresql://ci:ci@127.0.0.1:5432/shikhasetu_ci?schema=public

      - name: Deploy all Prisma migrations to clean PostgreSQL
        run: npx prisma migrate deploy --config prisma7.config.ts
        env:
          DATABASE_URL: postgresql://ci:ci@127.0.0.1:5432/shikhasetu_ci?schema=public

      - name: Generate Prisma Client
        run: npx prisma generate --config prisma7.config.ts
        env:
          DATABASE_URL: postgresql://ci:ci@127.0.0.1:5432/shikhasetu_ci?schema=public

      - name: Build API
        run: npm --prefix apps/api run build

      - name: Typecheck API
        run: npm --prefix apps/api run typecheck

      - name: Run Import, Occurrence and Rollback tests
        run: >
          node --test
          apps/api/tests/imports.service.test.cjs
          apps/api/tests/imports.commit.test.cjs
          apps/api/tests/occurrence-identity.service.test.cjs
          apps/api/tests/occurrences.service.test.cjs
          apps/api/tests/questions.service.test.cjs
          apps/api/tests/imports.controller.test.cjs
          apps/api/tests/html-question-parser.service.test.cjs
          apps/api/tests/import-image-standardization.service.test.cjs
          apps/api/tests/imports-rollback.service.test.cjs
          apps/api/tests/imports-export.service.test.cjs
          apps/api/tests/imports-error-report.service.test.cjs

      - name: Lint Frontend
        run: npm run lint --workspace=web

      - name: Build Frontend
        run: npm run build --workspace=web
        env:
          NEXT_TELEMETRY_DISABLED: 1
